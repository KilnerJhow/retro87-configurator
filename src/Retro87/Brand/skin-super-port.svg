<svg xmlns="http://www.w3.org/2000/svg" width="560" height="210" viewBox="0 0 560 210">
  <defs>
    <clipPath id="panel">
      <rect x="0" y="0" width="560" height="210" rx="10" />
    </clipPath>
  </defs>

  <g clip-path="url(#panel)">
    <rect width="560" height="210" fill="#141822" />
    <rect x="0" y="0" width="560" height="34" fill="#161B25" />
    <path d="M0 34H560" stroke="#E9B04C" stroke-opacity="0.35" />

    <text x="16" y="22" fill="#E7EAF2" font-family="sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.5">SUPER BUTTON INTERFACES</text>
    <text x="544" y="22" fill="#8791A6" font-family="monospace" font-size="7.5" letter-spacing="1" text-anchor="end">2 PER PORT</text>

    <!-- linhas de chamada -->
    <g stroke="#8791A6" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="3 3">
      <path d="M68 34V58" />
      <path d="M174 34V58" />
      <path d="M280 34V58" />
      <path d="M386 34V58" />
      <path d="M492 34V58" />
    </g>

    <!-- portas: KB, A, B, X, Y -->
    <g font-family="monospace" font-size="9" text-anchor="middle" letter-spacing="1">
      <text x="68" y="76" fill="#8791A6">KB</text>
      <text x="174" y="76" fill="#E9B04C">A</text>
      <text x="280" y="76" fill="#E9B04C">B</text>
      <text x="386" y="76" fill="#E9B04C">X</text>
      <text x="492" y="76" fill="#E9B04C">Y</text>
    </g>

    <!-- port rings -->
    <g fill="none" stroke-width="1.5">
      <circle cx="68" cy="118" r="22" stroke="#3A4152" />
      <circle cx="68" cy="118" r="13" stroke="#586074" stroke-opacity="0.8" />
      <circle cx="174" cy="118" r="22" stroke="#E9B04C" stroke-opacity="0.8" />
      <circle cx="174" cy="118" r="13" stroke="#E9B04C" stroke-opacity="0.45" />
      <circle cx="280" cy="118" r="22" stroke="#E9B04C" stroke-opacity="0.8" />
      <circle cx="280" cy="118" r="13" stroke="#E9B04C" stroke-opacity="0.45" />
      <circle cx="386" cy="118" r="22" stroke="#E9B04C" stroke-opacity="0.8" />
      <circle cx="386" cy="118" r="13" stroke="#E9B04C" stroke-opacity="0.45" />
      <circle cx="492" cy="118" r="22" stroke="#E9B04C" stroke-opacity="0.8" />
      <circle cx="492" cy="118" r="13" stroke="#E9B04C" stroke-opacity="0.45" />
    </g>

    <!-- two-button marks per port -->
    <g fill="#E9B04C">
      <circle cx="58" cy="160" r="2.2" opacity="0.9" />
      <circle cx="78" cy="160" r="2.2" opacity="0.9" />
      <circle cx="164" cy="160" r="2.2" opacity="0.9" />
      <circle cx="184" cy="160" r="2.2" opacity="0.9" />
      <circle cx="270" cy="160" r="2.2" opacity="0.9" />
      <circle cx="290" cy="160" r="2.2" opacity="0.9" />
      <circle cx="376" cy="160" r="2.2" opacity="0.9" />
      <circle cx="396" cy="160" r="2.2" opacity="0.9" />
      <circle cx="482" cy="160" r="2.2" opacity="0.9" />
      <circle cx="502" cy="160" r="2.2" opacity="0.9" />
    </g>

    <text x="280" y="190" fill="#586074" font-family="sans-serif" font-size="7.5" text-anchor="middle" letter-spacing="1.2">SELECT A PORT, THEN ITS PAIR</text>

    <!-- cantoneiras -->
    <g stroke="#E9B04C" stroke-width="1.2" opacity="0.5" fill="none">
      <path d="M10 48V10H40" />
      <path d="M520 10H550V48" />
      <path d="M10 200V168H40" />
      <path d="M520 200H550V168" />
    </g>
  </g>

  <rect x="0.5" y="0.5" width="559" height="209" rx="10" fill="none" stroke="#262C39" />
</svg>
