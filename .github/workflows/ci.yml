name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: build + selftest + tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          # 10.x builds (Avalonia 12 needs its compiler); 8.x is the runtime the app targets.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore tests/Retro87.Tests/Retro87.Tests.csproj

      - name: Build (Release)
        run: dotnet build src/Retro87/Retro87.csproj -c Release --no-restore --nologo

      - name: Self-test (no hardware)
        shell: bash
        run: dotnet src/Retro87/bin/Release/net8.0/Retro87.dll --selftest

      - name: Unit tests (no hardware)
        run: dotnet test tests/Retro87.Tests/Retro87.Tests.csproj -c Release --no-restore --nologo

  guards:
    name: repository guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Vendor artifacts must not be tracked
        run: ./scripts/check_vendor_artifacts.sh

      - name: udev rule must sort before 73
        run: ./scripts/check_udev_rule.sh

      - name: VERSION and csproj must agree
        run: ./scripts/check_version.sh

      - name: SPDX headers must be present
        run: ./scripts/check_spdx.sh
